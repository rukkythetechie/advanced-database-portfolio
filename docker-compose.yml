# Corridor Pay — local database environment
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset (deletes all data): docker compose down -v

services:
  postgres:
    image: postgres:16
    container_name: corridor-pg
    environment:
      POSTGRES_USER: corridor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: corridorpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: corridor-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
